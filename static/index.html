<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des chantiers</title>
<!-- Inter (corps) + Manrope (titres, substitut de Cal Sans). Réseau optionnel :
     si hors-ligne, on retombe sur la pile système définie dans le CSS. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Suivi des chantiers</h1>
  <span class="sub" id="subtitle"></span>
  <div class="grow"></div>
  <!-- générée par renderNav() depuis le registre VIEWS de app.js -->
  <nav class="nav" id="nav" aria-label="Vues"></nav>
  <button class="ghost primary" onclick="newChantier()">Nouveau chantier</button>
  <div class="menu right" id="searchMenu">
    <button class="ghost" onclick="openSearch(event)" title="Rechercher (touche / ou Ctrl+K)" aria-label="Rechercher"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></button>
    <div class="menu-list search-list" id="searchList" onclick="event.stopPropagation()">
      <input id="searchInput" class="search-inp" placeholder="Rechercher un chantier, une personne, un livrable, un risque, un point de recette…" oninput="renderSearch()">
      <div id="searchResults"></div>
    </div>
  </div>
  <div class="menu right" id="notifMenu">
    <button class="ghost bell" onclick="toggleMenu(event,'notifMenu')" title="Rappels" aria-label="Rappels"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge" id="notifBadge" style="display:none">0</span></button>
    <div class="menu-list notif-list" id="notifList"></div>
  </div>
  <div class="menu right" id="excelMenu">
    <button class="ghost" onclick="toggleMenu(event,'excelMenu')">Excel<svg class="ico car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="menu-list">
      <a onclick="document.getElementById('importFile').click()">Importer un fichier…</a>
      <a onclick="location='/api/template'">Télécharger le modèle</a>
      <a onclick="location='/api/export'">Exporter vers Excel</a>
    </div>
  </div>
  <input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="importExcel(this)">
</header>

<div class="bar-alert" id="alert"></div>

<div class="layout">
  <div class="work">
    <!-- .view : même marge et même largeur pour tous les écrans ; .view--doc : colonne de lecture -->
    <div class="board view" id="board"></div>
    <div class="actions-v view" id="actions" style="display:none"></div>
    <div class="notes-v view" id="notes" style="display:none"></div>
    <div class="themes-v view" id="themes" style="display:none"></div>
    <div class="planning view" id="planning" style="display:none"></div>
    <div class="dash view" id="dash" style="display:none"></div>
    <div class="activite view" id="activite" style="display:none"></div>
    <div class="rapport view view--doc" id="rapport" style="display:none"></div>
    <div class="charge view" id="charge" style="display:none"></div>
    <div class="risques view" id="risques" style="display:none"></div>
    <div class="people view" id="people" style="display:none"></div>
    <div class="contacts view" id="contacts" style="display:none"></div>
    <div class="absences view" id="absences" style="display:none"></div>
    <div class="cahiers view" id="cahiers" style="display:none"></div>
    <div class="cdc view" id="cdc" style="display:none"></div>
    <div class="recettes view" id="recettes" style="display:none"></div>
    <div class="page view" id="page" style="display:none"></div>
  </div>
</div>

<footer class="app-footer">
  <span class="fdot"></span><span class="fbrand">Suivi</span>
  <span>· pilotage des chantiers</span>
  <span class="fgrow"></span>
  <span>Tout en local · données dans <code>data/store.json</code></span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
