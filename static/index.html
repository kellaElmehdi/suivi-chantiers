<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des chantiers</title>
<!-- Inter (corps) + Manrope (titres, substitut de Cal Sans). Réseau optionnel :
     si hors-ligne, on retombe sur la pile système définie dans le CSS. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Suivi des chantiers</h1>
  <span class="sub" id="subtitle"></span>
  <div class="grow"></div>
  <div class="nav">
    <button class="on" data-v="board" onclick="setView('board')">Tableau</button>
    <button data-v="planning" onclick="setView('planning')">Planning</button>
    <button data-v="actions" onclick="setView('actions')" title="Tâches libres et routines — raccourci : a">Actions</button>
    <button data-v="notes" onclick="setView('notes')" title="Bloc-notes horodaté — raccourci : n">Bloc-notes</button>
    <button data-v="cahiers" onclick="setView('cahiers')">Cahiers des charges</button>
    <button data-v="recettes" onclick="setView('recettes')" title="Recette : les points à vérifier avant de livrer, et le temps passé">Recette</button>
    <div class="menu" id="navPilotage">
      <button data-group="dash,activite,charge,risques,rapport,themes" onclick="toggleMenu(event,'navPilotage')">Pilotage ▾</button>
      <div class="menu-list">
        <a onclick="setView('dash')">Tableau de bord</a>
        <a onclick="setView('activite')">Activité</a>
        <a onclick="setView('rapport')">Rapport hebdo</a>
        <a onclick="setView('charge')">Charge</a>
        <a onclick="setView('risques')">Risques</a>
        <a onclick="setView('themes')">Thèmes</a>
      </div>
    </div>
    <div class="menu" id="navPeople">
      <button data-group="people,contacts,absences" onclick="toggleMenu(event,'navPeople')">Personnes ▾</button>
      <div class="menu-list">
        <a onclick="setView('people')">Par personne</a>
        <a onclick="setView('contacts')">Annuaire</a>
        <a onclick="setView('absences')">Congés &amp; absences</a>
      </div>
    </div>
  </div>
  <button class="ghost primary" onclick="newChantier()">Nouveau chantier</button>
  <div class="menu right" id="searchMenu">
    <button class="ghost" onclick="openSearch(event)" title="Rechercher (touche / ou Ctrl+K)">🔍</button>
    <div class="menu-list search-list" id="searchList" onclick="event.stopPropagation()">
      <input id="searchInput" class="search-inp" placeholder="Rechercher un chantier, une personne, un livrable, un risque, un point de recette…" oninput="renderSearch()">
      <div id="searchResults"></div>
    </div>
  </div>
  <div class="menu right" id="notifMenu">
    <button class="ghost bell" onclick="toggleMenu(event,'notifMenu')" title="Rappels">🔔<span class="badge" id="notifBadge" style="display:none">0</span></button>
    <div class="menu-list notif-list" id="notifList"></div>
  </div>
  <div class="menu right" id="excelMenu">
    <button class="ghost" onclick="toggleMenu(event,'excelMenu')">Excel ▾</button>
    <div class="menu-list">
      <a onclick="document.getElementById('importFile').click()">Importer un fichier…</a>
      <a onclick="location='/api/template'">Télécharger le modèle</a>
      <a onclick="location='/api/export'">Exporter vers Excel</a>
    </div>
  </div>
  <input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="importExcel(this)">
</header>

<div class="bar-alert" id="alert"></div>

<div class="layout">
  <div class="work">
    <div class="board" id="board"></div>
    <div class="actions-v" id="actions" style="display:none"></div>
    <div class="notes-v" id="notes" style="display:none"></div>
    <div class="themes-v" id="themes" style="display:none"></div>
    <div class="planning" id="planning" style="display:none"></div>
    <div class="dash" id="dash" style="display:none"></div>
    <div class="activite" id="activite" style="display:none"></div>
    <div class="rapport" id="rapport" style="display:none"></div>
    <div class="charge" id="charge" style="display:none"></div>
    <div class="risques" id="risques" style="display:none"></div>
    <div class="people" id="people" style="display:none"></div>
    <div class="contacts" id="contacts" style="display:none"></div>
    <div class="absences" id="absences" style="display:none"></div>
    <div class="cahiers" id="cahiers" style="display:none"></div>
    <div class="cdc" id="cdc" style="display:none"></div>
    <div class="recettes" id="recettes" style="display:none"></div>
    <div class="page" id="page" style="display:none"></div>
  </div>
</div>

<footer class="app-footer">
  <span class="fdot"></span><span class="fbrand">Suivi</span>
  <span>· pilotage des chantiers</span>
  <span class="fgrow"></span>
  <span>Tout en local · données dans <code>data/store.json</code></span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
